[package]
name = "bellman-arb"
version = "0.2.0"
edition = "2021"
description = "Hyperliquid spot screener, paper trading and optional bounded live execution"

[features]
default = []
live = ["dep:k256", "dep:tiny-keccak", "dep:rmp-serde", "dep:hex"]

[dependencies]
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
tiny-keccak = { version = "2", features = ["keccak"], optional = true }
rmp-serde = { version = "1", optional = true }
hex = { version = "0.4", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
