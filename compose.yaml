name: bellman-hyperliquid
services:
  screener:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    cpus: 1
    image: bellman-hyperliquid:local
    build: .
    container_name: bellman-hyperliquid-screener
    environment:
      HL_PUBLIC_WS: ws://hyperliquid-data-hub:8766/ws?consumer=bellman-spot
      HL_ARCHIVE_HTTP: http://hyperliquid-data-hub:8766
    networks: [default, market-data]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - ./runs:/app/runs
      - ./config.toml:/app/config.toml:ro
    mem_limit: 512m
  check:
    image: rust:1.92-bookworm
    profiles: [tools]
    working_dir: /app
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/build
    environment:
      CARGO_TARGET_DIR: /build
    command: [cargo, test, --release, --locked]
volumes:
  cargo-registry:
  cargo-target:

networks:
  market-data:
    external: true
    name: hyperliquid-market-data
